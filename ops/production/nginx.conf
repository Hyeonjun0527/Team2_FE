server {
    listen 18081;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /pull-it {
        return 308 /pull-it/;
    }

    # The URL exposed to the browser has this prefix, but its SigV4 signature is
    # calculated for MinIO's private endpoint. Keep both the rewritten URI and
    # Host identical to that endpoint so MinIO can verify the signature.
    location /pull-it/storage/ {
        rewrite ^/pull-it/storage/(.*)$ /$1 break;
        proxy_pass http://pullit-prod-storage:9000;
        proxy_set_header Host pullit-prod-storage:9000;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location /pull-it/ {
        rewrite ^/pull-it/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 404;
    }
}
