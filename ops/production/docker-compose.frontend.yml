services:
  pullit-frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:18081:18081'
    volumes:
      - type: bind
        source: /opt/pullit/frontend/current
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - pullit-internal

networks:
  # Created by the backend compose contract on the dedicated Pull-it host.
  # Keeping it external makes a frontend-only deploy fail closed when that
  # contract has not been established yet.
  pullit-internal:
    external: true
    name: pullit-internal
