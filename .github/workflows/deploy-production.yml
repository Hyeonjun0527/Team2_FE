name: Deploy Pull-it Frontend to Yeon Pi
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      [
        src/**,
        public/**,
        package.json,
        pnpm-lock.yaml,
        vite.config.ts,
        tsconfig*.json,
        ops/production/**,
        .github/workflows/deploy-production.yml,
      ]
permissions: { contents: read }
concurrency: { group: pullit-frontend-production, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_PUBLIC_BASE_PATH: /pull-it/
          VITE_API_BASE_URL: /pull-it
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      - run: ops/production/verify-frontend-bundle.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: pullit-frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: pullit-frontend-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: pullit-frontend-${{ github.sha }}
          path: dist
      - run: ops/production/verify-frontend-bundle.sh dist
      - name: Configure dedicated Pi deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.PULLIT_DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.PULLIT_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and activate only this frontend revision
        env:
          DEPLOY_HOST: ${{ vars.PULLIT_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          staging="$(mktemp -d)"; trap 'rm -rf "$staging"' EXIT
          install -m 640 ops/production/docker-compose.frontend.yml "$staging/docker-compose.frontend.yml"
          install -m 640 ops/production/nginx.conf "$staging/nginx.conf"
          install -m 750 ops/production/deploy-frontend.sh "$staging/deploy-frontend.sh"
          install -m 750 ops/production/verify-frontend-bundle.sh "$staging/verify-frontend-bundle.sh"
          cp -a dist "$staging/dist"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "pullit-deploy@$DEPLOY_HOST" "mkdir -p /opt/pullit/incoming/frontend/${{ github.sha }}"
          scp -i ~/.ssh/id_ed25519 -r "$staging/." "pullit-deploy@$DEPLOY_HOST:/opt/pullit/incoming/frontend/${{ github.sha }}/"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "pullit-deploy@$DEPLOY_HOST" "sudo /usr/local/sbin/pullit-deploy frontend ${{ github.sha }}"
